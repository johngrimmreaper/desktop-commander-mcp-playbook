---
- name: Define the desired release manifest
  ansible.builtin.set_fact:
    dcmcp_manifest:
      schema: 2
      transport: "{{ dcmcp_transport }}"
      desktop_version: "{{ dcmcp_desktop_version }}"
      desktop_revision: "{{ dcmcp_desktop_revision }}"
      lock_blob: "{{ dcmcp_lock_blob }}"
      node_version: "{{ dcmcp_node_version }}"
      node_sha256: "{{ dcmcp_node_checksums[ansible_facts['architecture']] }}"
      architecture: "{{ ansible_facts['architecture'] }}"
    dcmcp_release_path: "{{ dcmcp_prefix }}/releases/{{ dcmcp_release_id }}"
    dcmcp_stage_path: "{{ dcmcp_prefix }}/releases/.{{ dcmcp_release_id }}.{{ dcmcp_user }}.staging"

- name: Record optional OpenAI transport artifacts in the immutable manifest
  ansible.builtin.set_fact:
    dcmcp_manifest: >-
      {{ dcmcp_manifest | combine(
           {'tunnel_version': dcmcp_tunnel_version,
            'tunnel_sha256': dcmcp_tunnel_checksums[ansible_facts['architecture']]}) }}
  when: dcmcp_transport == 'openai_tunnel'

- name: Inspect the desired release directory
  ansible.builtin.stat:
    path: "{{ dcmcp_release_path }}"
    follow: false
  register: dcmcp_release_stat

- name: Inspect an existing manifest
  ansible.builtin.stat:
    path: "{{ dcmcp_release_path }}/release.json"
    follow: false
  register: dcmcp_manifest_stat
  when: dcmcp_release_stat.stat.exists

- name: Reject incomplete releases and release-directory links
  ansible.builtin.assert:
    that:
      - dcmcp_release_stat.stat.isdir | default(false)
      - not dcmcp_release_stat.stat.islnk | default(false)
      - dcmcp_release_stat.stat.uid == 0
      - dcmcp_manifest_stat.stat.isreg | default(false)
      - not dcmcp_manifest_stat.stat.islnk | default(false)
    fail_msg: An incomplete or unexpected release exists; do not overwrite it.
  when: dcmcp_release_stat.stat.exists

- name: Read the existing non-secret manifest
  ansible.builtin.slurp:
    src: "{{ dcmcp_release_path }}/release.json"
  register: dcmcp_saved_manifest
  when: dcmcp_release_stat.stat.exists

- name: Prevent reusing a release name with different pins
  ansible.builtin.assert:
    that:
      - dcmcp_saved_manifest.content | b64decode | from_json == dcmcp_manifest
    fail_msg: Release pins changed under an existing ID; use a new version/revision instead.
  when: dcmcp_release_stat.stat.exists

- name: Build a new immutable release without affecting the active runtime
  when: not dcmcp_release_stat.stat.exists
  block:
    - name: Remove an incomplete staging directory from a previous failed build
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}"
        state: absent

    - name: Create a private staging directory for the existing user
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}"
        state: directory
        owner: "{{ dcmcp_user }}"
        group: "{{ dcmcp_gid }}"
        mode: "0700"

    - name: Download the official versioned Node archive with its pinned SHA-256
      ansible.builtin.get_url:
        url: >-
          https://nodejs.org/dist/v{{ dcmcp_node_version }}/node-v{{ dcmcp_node_version }}-linux-{{ dcmcp_node_arches[ansible_facts['architecture']] }}.tar.xz
        dest: "/var/cache/desktop-commander-mcp/node-{{ dcmcp_node_version }}-{{ ansible_facts['architecture'] }}.tar.xz"
        checksum: "sha256:{{ dcmcp_node_checksums[ansible_facts['architecture']] }}"
        owner: root
        group: root
        mode: "0644"
        validate_certs: true

    - name: Create the version-scoped Node directory
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}/node"
        state: directory
        owner: "{{ dcmcp_user }}"
        group: "{{ dcmcp_gid }}"
        mode: "0755"

    - name: Extract the verified Node archive
      ansible.builtin.unarchive:
        src: "/var/cache/desktop-commander-mcp/node-{{ dcmcp_node_version }}-{{ ansible_facts['architecture'] }}.tar.xz"
        dest: "{{ dcmcp_stage_path }}/node"
        remote_src: true
        extra_opts: [--strip-components=1]
        owner: "{{ dcmcp_user }}"
        group: "{{ dcmcp_gid }}"

    - name: Build the pinned MCP source with the bundled Node runtime
      ansible.builtin.import_tasks: build-mcp.yml
      become: true
      become_user: "{{ dcmcp_user }}"
      vars:
        dcmcp_build_python: /usr/bin/python3
        dcmcp_build_node: "{{ dcmcp_stage_path }}/node/bin/node"
        dcmcp_build_npm: "{{ dcmcp_stage_path }}/node/bin/npm"
        dcmcp_build_path: "{{ dcmcp_stage_path }}/node/bin:/usr/bin:/bin"
        dcmcp_build_esbuild: "{{ dcmcp_stage_path }}/mcp/node_modules/@esbuild/linux-{{ dcmcp_node_arches[ansible_facts['architecture']] }}/bin/esbuild"

    - name: Download the official tunnel client with its pinned release asset digest
      ansible.builtin.get_url:
        url: >-
          https://github.com/openai/tunnel-client/releases/download/v{{ dcmcp_tunnel_version }}/tunnel-client-v{{ dcmcp_tunnel_version }}-linux-{{ dcmcp_tunnel_arches[ansible_facts['architecture']] }}.zip
        dest: "/var/cache/desktop-commander-mcp/tunnel-{{ dcmcp_tunnel_version }}-{{ ansible_facts['architecture'] }}.zip"
        checksum: "sha256:{{ dcmcp_tunnel_checksums[ansible_facts['architecture']] }}"
        owner: root
        group: root
        mode: "0644"
        validate_certs: true
      when: dcmcp_transport == 'openai_tunnel'
    - name: Create the tunnel release directory
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}/tunnel"
        state: directory
        mode: "0755"
      when: dcmcp_transport == 'openai_tunnel'
    - name: Extract the verified tunnel client bundle
      ansible.builtin.unarchive:
        src: "/var/cache/desktop-commander-mcp/tunnel-{{ dcmcp_tunnel_version }}-{{ ansible_facts['architecture'] }}.zip"
        dest: "{{ dcmcp_stage_path }}/tunnel"
        remote_src: true
      when: dcmcp_transport == 'openai_tunnel'
    - name: Ensure the released client is executable
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}/tunnel/tunnel-client"
        state: file
        mode: "0755"
      when: dcmcp_transport == 'openai_tunnel'
    - name: Check the tunnel client version without starting a daemon
      ansible.builtin.command:
        argv: ["{{ dcmcp_stage_path }}/tunnel/tunnel-client", --version]
      register: dcmcp_tunnel_version_check
      changed_when: false
      failed_when: >-
        dcmcp_tunnel_version_check.rc != 0 or
        not (dcmcp_tunnel_version_check.stdout is search('(^|[^0-9])v?' +
        (dcmcp_tunnel_version | regex_escape) + '([^0-9]|$)'))
      when: dcmcp_transport == 'openai_tunnel'
    - name: Write the completion manifest only after successful build checks
      ansible.builtin.copy:
        content: "{{ dcmcp_manifest | to_nice_json }}\n"
        dest: "{{ dcmcp_stage_path }}/release.json"
        owner: root
        group: root
        mode: "0644"

    - name: Freeze the complete installation with root ownership
      ansible.builtin.file:
        path: "{{ dcmcp_stage_path }}"
        owner: root
        group: root
        mode: "u=rwX,go=rX"
        recurse: true
        follow: false

    - name: Publish the complete release directory with one rename
      ansible.builtin.command:
        argv: [/usr/bin/mv, -T, "--", "{{ dcmcp_stage_path }}", "{{ dcmcp_release_path }}"]
        creates: "{{ dcmcp_release_path }}/release.json"
      changed_when: true

# On SELinux hosts apply the vendor policy's default contexts, honoring any
# administrator-managed persistent fcontext rules. Never disable enforcement.
- name: Apply SELinux default labels to the versioned release on RPM systems
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - restorecon
      - -R
      - -v
      - "{{ dcmcp_release_path }}"
  register: dcmcp_release_relabel
  changed_when: dcmcp_release_relabel.stdout | length > 0
  when:
    - ansible_facts['distribution'] in ['RedHat', 'Fedora']
    - dcmcp_selinux_mode.stdout in ['Enforcing', 'Permissive']

# A matching completion manifest is not proof that its artifacts still exist.
# Use the current controller helper even before the installed helper is updated.
- name: Validate the immutable bundle before accepting a new or reused release
  become: true
  become_user: "{{ dcmcp_user }}"
  ansible.builtin.script:
    cmd: >-
      {{ (role_path + '/files/preflight.py') | quote }}
      --release-only
      --user {{ dcmcp_user | quote }}
      --home {{ dcmcp_home | quote }}
      --workdir {{ dcmcp_workdir | quote }}
      --release {{ dcmcp_release_path | quote }}
    executable: /usr/bin/python3
  environment:
    HOME: "{{ dcmcp_home }}"
  changed_when: false
