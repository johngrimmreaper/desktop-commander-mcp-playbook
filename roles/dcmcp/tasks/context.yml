---
# This guard MUST run before any host-dependent task or installation mutation.
# An unset/empty value is not replaced by the SSH/login/Ansible user.
- name: Require explicit runtime account selection in the private inventory
  ansible.builtin.assert:
    that:
      - dcmcp_user | default('', true) is match('^[a-z_][a-z0-9_-]*$')
    fail_msg: >-
      Set dcmcp_user to an existing non-root Linux account in your
      untracked inventory/hosts.yml before running any playbook.
      No default or automatic account selection is allowed.

- name: Require the supported native Linux systemd baseline
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04')
        or (ansible_facts['distribution'] == 'RedHat' and ansible_facts['distribution_major_version'] == '10')
        or (ansible_facts['distribution'] == 'Fedora' and ansible_facts['distribution_major_version'] in ['43', '44'])
        or (ansible_facts['distribution'] == 'Archlinux')
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - ansible_facts['service_mgr'] == 'systemd'
      - ansible_facts.get('virtualization_tech_guest', []) | intersect(['container']) | length == 0
      - ansible_facts.get('virtualization_type', '') not in ['docker', 'podman', 'container', 'lxc', 'lxd', 'containerd', 'systemd-nspawn', 'openvz']
      - ansible_version['full'] is version('2.21', '>=')
      - ansible_version['full'] is version('2.22', '<')
      - not ansible_check_mode
      - dcmcp_home == '/var/lib/desktop-commander-mcp/home'
      - dcmcp_prefix == '/opt/desktop-commander-mcp'
      - dcmcp_helpers == '/usr/local/libexec/desktop-commander-mcp'
      - dcmcp_service == 'desktop-commander-mcp.service'
    fail_msg: >-
      Supported native hosts: Ubuntu 26.04, RHEL 10, Fedora 43/44 and
      Arch Linux/Omarchy rolling, amd64/arm64 with systemd. Unvalidated
      targets require native integration tests before production use. No containers or check-mode installs.

# Facts are useful hints, but container technologies are not a closed set.
# Check the target itself before any account lookup or installation mutation.
- name: Require systemd to report that the target is outside a container
  ansible.builtin.command:
    argv: [/usr/bin/systemd-detect-virt, --container]
  register: dcmcp_container_probe
  changed_when: false
  failed_when: dcmcp_container_probe.rc != 1

- name: Read the target's PID 1 process name
  ansible.builtin.command:
    argv: [/usr/bin/cat, /proc/1/comm]
  register: dcmcp_pid_one
  changed_when: false

- name: Require a native systemd PID 1
  ansible.builtin.assert:
    that:
      - dcmcp_pid_one.stdout | trim == 'systemd'
    fail_msg: The target must run systemd as PID 1 outside a container.

- name: Look up the existing runtime user
  ansible.builtin.getent:
    database: passwd
    key: "{{ dcmcp_user }}"
    fail_key: true

- name: Derive the existing account home and primary group
  ansible.builtin.set_fact:
    dcmcp_account_home: "{{ ansible_facts['getent_passwd'][dcmcp_user][4] }}"
    dcmcp_gid: "{{ ansible_facts['getent_passwd'][dcmcp_user][2] }}"
    dcmcp_uid: "{{ ansible_facts['getent_passwd'][dcmcp_user][1] }}"

- name: Validate fixed paths and release identifiers
  ansible.builtin.assert:
    that:
      - dcmcp_uid | int > 0
      - dcmcp_account_home is match('^/[A-Za-z0-9_./-]+$')
      - dcmcp_workdir is match('^/[A-Za-z0-9_./-]+$')
      - dcmcp_config_dir == dcmcp_home + '/.config/desktop-commander-mcp'
      - dcmcp_tunnel_config == dcmcp_config_dir + '/tunnel.yaml'
      - dcmcp_runtime_key == dcmcp_config_dir + '/runtime.key'
      - dcmcp_desktop_config == dcmcp_account_home + '/.claude-server-commander/config.json'
      - dcmcp_examples == '/usr/local/share/desktop-commander-mcp'
      - dcmcp_release_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{1,180}$')
      - dcmcp_target_release is match('^[A-Za-z0-9][A-Za-z0-9._-]{1,180}$')
    fail_msg: Invalid paths or release identifier; no user or sudoers changes are made.

- name: Inspect the existing account home
  ansible.builtin.stat:
    path: "{{ dcmcp_account_home }}"
    follow: false
  register: dcmcp_account_home_stat

- name: Require an existing real account home owned by the runtime user
  ansible.builtin.assert:
    that:
      - dcmcp_account_home_stat.stat.isdir | default(false)
      - not dcmcp_account_home_stat.stat.islnk | default(false)
      - dcmcp_account_home_stat.stat.uid == dcmcp_uid | int
    fail_msg: The existing runtime user must own a real account home directory.
