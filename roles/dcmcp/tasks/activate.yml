---
- name: Validate the operator's active files before stopping any running service
  ansible.builtin.import_tasks: preflight.yml

- name: Inspect the current release selector
  ansible.builtin.stat:
    path: "{{ dcmcp_current }}"
    follow: false
  register: dcmcp_current

- name: Reject unexpected current-selector objects
  ansible.builtin.assert:
    that:
      - dcmcp_current.stat.islnk | default(false)
      - dcmcp_current.stat.uid == 0
      - dcmcp_current.stat.lnk_source is match('^/opt/desktop-commander-mcp/releases/[A-Za-z0-9][A-Za-z0-9._-]{1,180}$')
    fail_msg: The current selector is not a managed root-owned release link.
  when: dcmcp_current.stat.exists | default(false) or dcmcp_current.stat.islnk | default(false)

# Ansible service facts can report status=failed instead of the unit's enablement.
# Query the two independent systemd properties so rescue preserves boot policy.
- name: Gather the previous runtime and enablement states independently
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, "{{ dcmcp_service }}", --property=ActiveState, --property=UnitFileState]
  register: dcmcp_previous_state
  changed_when: false

- name: Remember the previous selection and enablement
  ansible.builtin.set_fact:
    dcmcp_previous_release: "{{ dcmcp_current.stat.lnk_source | default('') | basename }}"
    dcmcp_previous_enabled: >-
      {{ 'UnitFileState=enabled' in dcmcp_previous_state.stdout_lines }}
    dcmcp_previous_running: >-
      {{ 'ActiveState=active' in dcmcp_previous_state.stdout_lines }}

- name: Compute the private activation fingerprint after successful offline validation
  become: true
  become_user: "{{ dcmcp_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ dcmcp_helpers }}/preflight.py"
      - --user
      - "{{ dcmcp_user }}"
      - --workdir
      - "{{ dcmcp_workdir }}"
      - --release
      - "{{ dcmcp_prefix }}/releases/{{ dcmcp_target_release }}"
      - --fingerprint
  environment:
    HOME: "{{ dcmcp_home }}"
  register: dcmcp_fingerprint
  changed_when: false
  no_log: true

- name: Inspect the prior private activation stamp
  ansible.builtin.stat:
    path: "{{ dcmcp_activation_stamp }}"
  register: dcmcp_stamp_stat

- name: Read the prior private activation stamp
  ansible.builtin.slurp:
    src: "{{ dcmcp_activation_stamp }}"
  register: dcmcp_stamp
  when: dcmcp_stamp_stat.stat.exists
  no_log: true

- name: Determine whether activation inputs changed
  ansible.builtin.set_fact:
    dcmcp_needs_restart: >-
      {{ dcmcp_restart | bool or not dcmcp_previous_running | bool or
         dcmcp_previous_release != dcmcp_target_release or
         not dcmcp_stamp_stat.stat.exists or
         (dcmcp_stamp.content | default('') | b64decode | trim) != dcmcp_fingerprint.stdout }}
  no_log: true

- name: Read the validated tunnel settings for the local readiness endpoint
  ansible.builtin.slurp:
    src: "{{ dcmcp_tunnel_config }}"
  register: dcmcp_validated_yaml
  no_log: true

- name: Derive the local health listener address
  ansible.builtin.set_fact:
    dcmcp_health_address: "{{ (dcmcp_validated_yaml.content | b64decode | from_yaml)['health']['listen_addr'] }}"
  no_log: true

- name: Switch or restart only after validation and complete cgroup shutdown
  when: dcmcp_needs_restart | bool
  block:
    - name: Stop the current daemon and all its children before replacement
      ansible.builtin.systemd_service:
        name: "{{ dcmcp_service }}"
        state: stopped

    - name: Atomically select the validated release
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ dcmcp_helpers }}/select-release.py"
          - "{{ dcmcp_target_release }}"
          - "{{ dcmcp_user }}"
      changed_when: true

    - name: Reload the installed unit definition
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Reload can unload an inactive, disabled unit. Querying its properties loads
    # the installed definition; only a retained failed unit needs reset-failed.
    - name: Inspect the installed unit before clearing a previous failure
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, "{{ dcmcp_service }}", --property=LoadState, --property=ActiveState]
      register: dcmcp_start_state
      changed_when: false

    - name: Require a loadable installed unit before starting
      ansible.builtin.assert:
        that:
          - "'LoadState=loaded' in dcmcp_start_state.stdout_lines"
        fail_msg: The installed systemd unit could not be loaded.

    - name: Clear a retained start-rate or configuration failure
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, reset-failed, "{{ dcmcp_service }}"]
      changed_when: false
      when: "'ActiveState=failed' in dcmcp_start_state.stdout_lines"

    - name: Enable and start the explicitly activated daemon
      ansible.builtin.systemd_service:
        name: "{{ dcmcp_service }}"
        enabled: true
        state: started

    # HTTP 200 alone can come from another process while this unit has failed.
    # Verify its main PID owns the listener and remains the same across the request.
    - name: Require readiness from the managed daemon after activation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ dcmcp_helpers }}/readiness.py"
          - --unit
          - "{{ dcmcp_service }}"
          - --listen-addr
          - "{{ dcmcp_health_address }}"
      register: dcmcp_readiness
      until: dcmcp_readiness.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      no_log: true

    - name: Record the successfully activated input fingerprint
      ansible.builtin.copy:
        content: "{{ dcmcp_fingerprint.stdout }}\n"
        dest: "{{ dcmcp_activation_stamp }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

  rescue:
    - name: Stop the failed replacement and restore prior enablement
      ansible.builtin.systemd_service:
        name: "{{ dcmcp_service }}"
        enabled: "{{ dcmcp_previous_enabled | bool }}"
        state: stopped

    - name: Restore the previous release selector if one existed
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ dcmcp_helpers }}/select-release.py"
          - "{{ dcmcp_previous_release }}"
          - "{{ dcmcp_user }}"
      when: dcmcp_previous_release | length > 0
      changed_when: true

    - name: Remove the selector after a failed first activation
      ansible.builtin.file:
        path: "{{ dcmcp_current }}"
        state: absent
      when: dcmcp_previous_release | length == 0

    - name: Report failed activation without claiming rollback health
      ansible.builtin.fail:
        msg: >-
          Activation failed. The previous selection and enablement were restored;
          the service is stopped. Inspect the journal and local readiness,
          fix the issue, then run preflight and activate again.

- name: Preserve or restore enablement without restarting unchanged inputs
  ansible.builtin.systemd_service:
    name: "{{ dcmcp_service }}"
    enabled: true
    state: started
  when: not dcmcp_needs_restart | bool

- name: Verify managed daemon readiness for an unchanged running release
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ dcmcp_helpers }}/readiness.py"
      - --unit
      - "{{ dcmcp_service }}"
      - --listen-addr
      - "{{ dcmcp_health_address }}"
  changed_when: false
  when: not dcmcp_needs_restart | bool
  no_log: true
