---
# REQUIRED: set dcmcp_user explicitly in an untracked local inventory.
# Never infer it from the Ansible connection account or default to mcp_operator/root.
# Each selected MCP transport uses the configured account's real passwd HOME.
# All per-instance system files are namespaced by dcmcp_user.
# The account and its existing sudo rights remain unchanged.
dcmcp_home: "{{ dcmcp_account_home }}"
dcmcp_workdir: "{{ dcmcp_account_home }}"
dcmcp_prefix: /opt/desktop-commander-mcp
dcmcp_instance_dir: "{{ dcmcp_prefix }}/instances/{{ dcmcp_user }}"
dcmcp_current: "{{ dcmcp_instance_dir }}/current"
dcmcp_helpers: "/usr/local/libexec/desktop-commander-mcp/{{ dcmcp_user }}"
dcmcp_examples: "/usr/local/share/desktop-commander-mcp/{{ dcmcp_user }}"
dcmcp_state_dir: "/var/lib/desktop-commander-mcp/{{ dcmcp_user }}"
dcmcp_activation_stamp: "{{ dcmcp_state_dir }}/activation.sha256"
dcmcp_service: "desktop-commander-mcp@{{ dcmcp_user }}.service"
dcmcp_monitor_service: "desktop-commander-mcp-health@{{ dcmcp_user }}.service"
dcmcp_monitor_timer: "desktop-commander-mcp-health@{{ dcmcp_user }}.timer"
dcmcp_runtime_dir: "desktop-commander-mcp-{{ dcmcp_user }}"
dcmcp_health_port: "{{ 10000 + (dcmcp_uid | int) % 45000 }}"
dcmcp_config_dir: "{{ dcmcp_home }}/.config/desktop-commander-mcp"
dcmcp_tunnel_config: "{{ dcmcp_config_dir }}/tunnel.yaml"
dcmcp_runtime_key: "{{ dcmcp_config_dir }}/runtime.key"
dcmcp_desktop_config: "{{ dcmcp_account_home }}/.claude-server-commander/config.json"

# Standard MCP stdio is the default for every installation.
# Optional provider-specific transports must be explicitly selected.
# No compatibility with releases installed before this transport split.
dcmcp_transport: stdio

# Version + source revision are explicit; no @latest, npx or floating branch.
dcmcp_desktop_version: "0.3.4"
dcmcp_desktop_revision: 9a101b17e44577f0baefa4c7120f087881c5cc56
dcmcp_lock_blob: bb49e09899880d7266eee515eb6232849b25f1ee
dcmcp_node_version: "24.21.0"
dcmcp_tunnel_version: "0.0.16"
# SHA-256 values obtained from primary sources; see docs/upstream.md.
dcmcp_node_checksums:
  x86_64: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
  aarch64: 6ad1325edbdb5649c379b75a237147a666c95d4f9ae8d340fef2d1575d289ad2
dcmcp_tunnel_checksums:
  x86_64: d60cdba019bce451bcc3a15478cc5b9cb11270b049f5b56ea39a80b517f8b117
  aarch64: 963d0384aaa7c798778479c45673f9051a4039dd891aef8f8978d2a1a628b74f
dcmcp_node_arches:
  x86_64: x64
  aarch64: arm64
dcmcp_tunnel_arches:
  x86_64: amd64
  aarch64: arm64
dcmcp_release_id: >-
  dc-v2-{{ dcmcp_desktop_version }}-{{ dcmcp_desktop_revision[:12] }}-node-{{ dcmcp_node_version }}-{{ 'openai-tunnel-' + dcmcp_tunnel_version if dcmcp_transport == 'openai_tunnel' else 'stdio' }}-{{ ansible_facts['architecture'] }}
# Override this with an installed release ID for rollback. Never a path.
dcmcp_target_release: "{{ dcmcp_release_id }}"
# Force a restart when needed; otherwise activation compares its input fingerprint.
dcmcp_restart: false
# Uninstall preserves active configs, keys, home/work files and OS dependencies.
