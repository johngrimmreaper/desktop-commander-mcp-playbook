---
- name: Activate Desktop Commander MCP tunnel
  hosts: mcp_servers
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Activate vendor-neutral stdio entrypoint
      ansible.builtin.include_role:
        name: dcmcp
        tasks_from: activate-stdio
      when: dcmcp_transport | default('stdio') == 'stdio'

    - name: Activate the optional OpenAI tunnel service
      ansible.builtin.include_role:
        name: dcmcp
        tasks_from: activate
      when: dcmcp_transport | default('stdio') == 'openai_tunnel'
