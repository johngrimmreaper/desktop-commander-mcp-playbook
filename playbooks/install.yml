---
- name: Install Desktop Commander MCP
  hosts: mcp_servers
  become: false
  gather_facts: true
  serial: 1
  tasks:
    - name: Run the platform install operation
      ansible.builtin.include_role:
        name: dcmcp
        tasks_from: "{{ 'install-solaris' if ansible_facts['system'] == 'SunOS' else 'main' }}"
        apply:
          become: "{{ ansible_facts['system'] != 'SunOS' }}"
