---
# Run Ansible on the machine being configured.
# Copy to inventory/hosts.yml and select an existing runtime account.
all:
  children:
    mcp_servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          dcmcp_user: REPLACE_WITH_EXISTING_ACCOUNT
          dcmcp_transport: stdio
          # Replace the placeholder with an existing non-root account.
          # Default working directory is the account's existing home.
