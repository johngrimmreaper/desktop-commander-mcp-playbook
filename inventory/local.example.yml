---
# Run Ansible directly on the Ubuntu 26.04, RHEL 10 or Fedora 43/44 development/server VM.
# Copy manually to inventory/hosts.yml; no SSH or Docker is used.
all:
  children:
    mcp_servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          dcmcp_user: REPLACE_WITH_EXISTING_LINUX_ACCOUNT
          # REQUIRED: replace the placeholder with an existing non-root Linux user.
          # Spaces only; align dcmcp_user with the two settings above.
          # Default working directory: the existing account's passwd home.
          # Process HOME is /var/lib/desktop-commander-mcp/home.
